[mod]

name="Auto slot"
description="Uses the slot for you, on a toggle."
enabled=true

; A node the loader instantiates and adds to the tree, so the mod gets _process and can watch
; the scene tree. Used here instead of an extension because the slot screen is preloaded by an
; autoload that runs before the loader - see the comment at the top of AutoSlot.gd.
script="AutoSlot.gd"
