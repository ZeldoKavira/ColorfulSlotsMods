; Colorful Slots mod configuration - SHIPPED DEFAULTS.
;
; This file is replaced when the mod updates, so an edit made here does not survive one. It is
; the defaults, not your settings.
;
; Change things in the F1 panel instead, or edit user://mod_settings.cfg, which is layered
; over this file at load and is never touched by an update. Only the keys you actually change
; need to appear there - anything absent falls through to the values below, so a new default
; added by a later version still reaches you.
;
; Where user:// is, is printed on the second line of user://mod_loader.log.
;
; Edit and restart the game. This is the config panel - the game has no way to add UI to its
; own settings screen without rebuilding its pack, so the settings live here instead.

[debug]

; Turn this on if auto slot appears to do nothing. It writes to user://auto_slot.log, naming
; the condition that is stopping it - most often that there is no run in progress, since it
; only acts on the slot screen itself.
;
; The F1 panel has a tickbox for this. Prefer it: a value set there is written to
; user://mod_settings.cfg and survives updating the mod, which a change made here does not.
;
; Logged on change rather than every frame, so a whole session is a handful of lines.
auto_slot=false

[upgrades]

; Buy back the upgrades you had, as you can afford them.
;
; This is continuous rather than a one-off after an all-in. An all-in zeroes your cash, so
; there is nothing to spend at the moment it happens - the upgrades get bought back gradually
; out of what comes in while you roll, each level the moment it is affordable. It works while
; the slot screen is up, with the upgrade tree neither open nor built.
;
; The record is the highest level ever reached for each upgrade, kept in
; user://upgrade_targets.cfg. It is not reset by an all-in - a record that followed the levels
; down would forget everything at the moment it is wanted.
;
; It never overshoots: the game's own buy button keeps levelling a cash upgrade while a
; quarter of your cash still covers it, and that is not copied here.
buy_back=true

[hotkeys]

; What opens the panel and what toggles auto slot. Both accept a keyboard key name and a list
; of joypad buttons; either can be left empty.
;
; Keyboard key names are Godot's own - F1, F2, Tab, Insert, Home, and so on.
panel_key="F1"
auto_key="F2"
restart_key="F3"

; Joypad buttons, comma separated, quoted. Set empty to unbind.
;
; The defaults are the Steam Deck's upper back grips (L4 and R4), which are unbound there by
; default, and which a controller without paddles simply never reports. If your controller
; does use those, change them - which buttons are free varies by layout.
;
; Avoid 1, 4, 6, 9 and 10 unless you change them below too: the [controller] section of this
; same file binds those to the game's own actions, so reusing one here means a single press
; both opens the panel and switches tab. They are this mod's choices, not the game's, so
; either list can be edited freely - just keep them apart.
;
; On a Steam Deck the back grip buttons are the ones to reach for: they are unbound by default
; and Godot sees them as ordinary joypad buttons. 16 and 17 are the upper pair (L4/R4), 18 and
; 19 the lower pair (L5/R5). Try "16" for the panel and "17" for auto slot.
;
; Full list: 0 A, 1 B, 2 X, 3 Y, 4 Back, 5 Guide, 6 Start, 7 L-stick, 8 R-stick,
; 9 L-shoulder, 10 R-shoulder, 11-14 D-pad, 15 Misc, 16-19 paddles, 20 touchpad.
;
; Worth knowing: a Steam Deck can map a keyboard key onto any button through Steam Input,
; per game, with no mod change at all. These exist so it does not have to.
panel_buttons="16"
auto_buttons="17"

; Moves between the lobby and a run, read by context: from the lobby it starts one, from the
; slot screen it leaves one. 3 is the top face button - Triangle on a PlayStation pad, Y on an
; Xbox pad or a Steam Deck.
;
; Starting only fires when the game would allow it: the lobby has to be up with its Start
; button visible, so it cannot begin a run the game is midway through setting up.
;
; Leaving ends the run the way holding Exit does, so the score is banked and saved, and then
; continues to the upgrade menu once the result appears. The game has no mid-run exit that
; skips that, and taking one would lose the run.
; Toggles auto restart. 18 is the lower-left back grip on a Steam Deck - free, like 16 and 17,
; and not one of the buttons the [controller] section below binds.
restart_buttons="18"

start_run_buttons="3"

; Returns to the upgrade menu from the result screen - the same thing its Lobby button does.
; 1 is the right face button: B on an Xbox pad or a Steam Deck, Circle on a PlayStation pad.
;
; Only acts while the result screen is up, so it cannot abandon a run mid-play. The game also
; binds 1 to its own "exit" action through the [controller] section below; that needs a hold
; to do anything and is inert on the result screen, so the two do not fight.
to_lobby_buttons="1"
to_lobby_key=""
start_run_key=""

[display]

; The game requests exclusive fullscreen, which switches your display to its window size and
; centres the image. This turns that into borderless fullscreen at your native resolution.
borderless_fullscreen=true

[auto]

; Auto slot: keeps using the slot for you while you have coins, on the same terms the game
; allows a manual press. Toggle in game with F2, or from the F1 panel - the toggle is saved to
; user://mod_settings.cfg, so it survives a restart.
;
; It only does anything on the slot screen itself. Toggling it in the lobby is remembered but
; has nothing to act on until a run starts.
;
; On by default: this is the point of the mod, and on a Steam Deck there is no keyboard to
; press the toggle with before anything happens.
enabled=true

; Optional pause between rolls, in seconds. A roll cannot start until the previous one has
; finished regardless, so 0 simply means "as soon as it can".
delay_seconds=0.0

; How much faster a spin resolves, 1.0 to 10.0. There is a slider on the F1 panel.
;
; The spin is a chain of tweens and awaited timers rather than one adjustable duration, so
; this scales engine time while one is resolving - the only lever that moves all of them
; together and keeps them in step. It is applied only during a spin, so menus, transitions and
; the result screen stay at normal speed.
;
; 1.0 leaves the game completely untouched.
spin_speed=1.0

; Restart straight from the result screen when a run ends, rather than pressing Retry. This is
; the game's own Retry, so it spends what Retry spends and keeps your upgrades.
restart_on_result=true

; How long the result screen stays up before restarting. The point is to be able to read it -
; at 0 it vanishes before you can.
restart_delay_seconds=2.0

[controller]

; Joypad buttons to add to the game's existing actions. Existing keyboard and mouse bindings
; are left alone - these are added alongside, never replacing.
;
; Several buttons can be bound to one action with a comma separated list.
; Values must be quoted - the config parser reads them as strings.
;
; Button numbers (Godot JoyButton):
;   0 A / Cross        1 B / Circle       2 X / Square      3 Y / Triangle
;   4 Back / Select    5 Guide            6 Start
;   7 Left stick       8 Right stick      9 Left shoulder  10 Right shoulder
;  11 D-pad up        12 D-pad down      13 D-pad left     14 D-pad right

; Moving between tabs - this is what reaches the slots screen on a controller.
move_tab="10,9"

; The Steam / shop tab.
steam_tab="4"

; Open and close the settings screen.
setting="6"

; Back out of a screen.
exit="1"
