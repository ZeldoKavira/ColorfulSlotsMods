; Colorful Slots - display fixes and mod loader registration.
;
; Godot reads override.cfg from beside the executable and applies it over the settings baked
; into the pack. Nothing in the game is modified; delete this file to put everything back.
;
; This file is written by hand rather than by the ModLoader self-setup, because that setup
; runs itself with "--script", and this build reports that option as unavailable in release
; export templates. The setup's only output is an override.cfg, so writing it directly gets
; to the same place.

[autoload]

; res:// falls back to the real filesystem beside the executable when a path is not inside
; the pack, which is how addons/ is reachable without touching game.pck at all - and why a
; Steam update, which only replaces game.exe and game.pck, cannot remove the mod loader.
;
; The store has to come before the loader; the loader reads state from it on startup.
ModLoader="*res://mods/loader.gd"

[display]

; The game ships a 640x360 viewport with stretch/scale_mode = "integer", which scales only by
; whole multiples and centres the remainder rather than filling the display.
window/stretch/scale_mode="fractional"
window/stretch/aspect="expand"

; The game never calls window_set_vsync_mode, so this project setting is the only thing
; deciding v-sync and nothing overrides it at runtime.
window/vsync/vsync_mode=1

[application]

