; Colorful Slots - mod loader registration and display fixes.
;
; Godot reads override.cfg from beside the executable and applies it over the settings baked
; into game.pck. Nothing in the game itself is modified - delete this file and the mods folder
; to put everything back exactly as it was.

[autoload]

; res:// falls back to the real filesystem beside the executable when a path is not inside the
; pack. That is what lets an autoload point at a script which was never exported with the
; game, and it is why no pack modification is needed. A Steam update replaces game.exe and
; game.pck but leaves added files alone, so this survives one.
ModLoader="*res://mods/loader.gd"

[application]

; Marks a modded run, so it is obvious at a glance whether the loader is active.
config/name="Colorful Slots (Modded)"

[display]

; The game ships a 640x360 viewport with stretch/scale_mode = "integer", which scales only in
; whole multiples and centres the remainder instead of filling the display.
window/stretch/scale_mode="fractional"
window/stretch/aspect="expand"

; V-sync. No script in the game calls window_set_vsync_mode, so this project setting is the
; only thing deciding it and nothing overrides it at runtime.
; 1 = enabled, 2 = adaptive, 3 = mailbox, 0 = off.
window/vsync/vsync_mode=1
